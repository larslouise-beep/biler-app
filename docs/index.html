<style>
/* Toyota brand visual identity: Signature Grey #282830, TME Signature Red #FF0022, TME Grey 1–6 */
:root{
  --tgrey:#282830;--tred:#FF0022;--g1:#494950;--g2:#6A6B70;--g3:#8B8C90;--g4:#ADADB0;--g5:#CECFD0;--g6:#EFF0F0;
  --bg:var(--g6);--card:#fff;--ink:var(--tgrey);--mut:var(--g2);--line:var(--g5);
  --acc:var(--tgrey);--acc2:var(--g6);--onacc:#fff;
  --ok:#1d6b43;--okbg:#e3efe8;--warn:#8a5a00;--warnbg:#f6ecd6;--bad:#c4001a;--badbg:#fde6e9;
  --r:2px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--tgrey);--card:#34343c;--ink:#fff;--mut:var(--g4);--line:var(--g1);
  --acc:#fff;--acc2:var(--g1);--onacc:var(--tgrey);
  --ok:#7fd3a3;--okbg:#26392f;--warn:#f0c26a;--warnbg:#3d3424;--bad:#ff6b7d;--badbg:#45262c;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Lato,"Toyota Type",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--tgrey);color:#fff;border-bottom:3px solid var(--tred);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;line-height:1.15;font-weight:300;letter-spacing:.06em;text-transform:uppercase;margin:0;flex:1}
header h1 small{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--g4)}
.sync{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--g4);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g3)}
.dot.on{background:#4cc27f}.dot.err{background:var(--tred)}
main{max-width:900px;margin:0 auto;padding:16px 14px 110px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--g3);padding:4px 8px;cursor:pointer;min-width:62px;border-top:2px solid transparent}
nav.tabs button.on{color:var(--ink);font-weight:700;border-top-color:var(--tred)}
nav.tabs svg{width:22px;height:22px;stroke-width:1.6}
nav.tabs .scanbtn{background:var(--tred);color:#fff;border-radius:50%;width:62px;height:62px;margin-top:-26px;justify-content:center;box-shadow:0 4px 14px rgba(40,40,48,.35);border:0}
nav.tabs .scanbtn svg{width:26px;height:26px;stroke-width:1.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:13px}.tiny{font-size:12px}
h2{font-size:18px;font-weight:300;letter-spacing:.05em;text-transform:uppercase;margin:4px 0 10px}
h3{font-size:12px;font-weight:700;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
.btn{border:1px solid var(--ink);background:transparent;border-radius:var(--r);padding:10px 16px;cursor:pointer;font-weight:400;letter-spacing:.02em}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.btn.dan{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.block{width:100%;padding:14px}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px 12px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pill{display:inline-block;font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:var(--r);background:var(--g6);color:var(--tgrey);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}.pill.bad{background:var(--tred);color:#fff;border-color:transparent}.pill.grey{background:transparent;color:var(--mut)}
@media (prefers-color-scheme:dark){.pill{background:var(--g1);color:#fff}}
.veh{display:block;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);padding:12px 14px;transition:border-color .15s}
.veh:hover{border-left-color:var(--tred)}
.veh+.veh{margin-top:8px}
.veh .t{font-weight:700}
.loc{display:flex;gap:6px;align-items:flex-start;font-size:14px;margin-top:4px}
.loc svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--mut);stroke-width:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.locbtn{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;min-height:52px}
.locbtn.on{border-color:var(--acc);background:var(--acc);color:var(--onacc);font-weight:700}
.locbtn.on .mut{color:inherit;opacity:.75}
.locbtn .tiny{display:block;font-weight:400}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left}
.stat b{font-size:30px;font-weight:300;display:block;line-height:1.1}
.stat span{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.seg{display:flex;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px 6px;cursor:pointer;border-right:1px solid var(--ink);font-size:14px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--onacc);font-weight:700}
.banner{border-radius:var(--r);padding:10px 12px;font-size:14px;margin-bottom:12px;border-left:3px solid currentColor}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.info{background:var(--card);color:var(--ink);border-left-color:var(--tred)}
.sheetwrap{position:fixed;inset:0;z-index:20;background:rgba(40,40,48,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:4px 4px 0 0;border-top:3px solid var(--tred);padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheetwrap{align-items:center}.sheet{border-radius:2px}}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .hd h2{flex:1;margin:0}
.x{background:none;border:0;font-size:28px;font-weight:300;line-height:1;cursor:pointer;color:var(--mut);padding:0 4px}
.hist{font-size:13px;border-left:2px solid var(--tred);padding-left:12px}
.hist div+div{margin-top:8px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--tgrey);color:#fff;border-left:3px solid var(--tred);padding:10px 16px;border-radius:var(--r);z-index:30;font-size:14px;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.spin{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--tred);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.vin{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
table.lbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line)}
table.lbl thead td{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
table.lbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lbl input{width:20px;height:20px;accent-color:var(--tgrey)}
input[type=checkbox]{accent-color:var(--tgrey)}
.hidden{display:none!important}
</style>
<style>
.login{max-width:420px;margin:20px auto}
.pinfield{font-size:28px!important;letter-spacing:.4em;text-align:center;padding:14px!important}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

a{color:inherit}
/* etiketter 75 x 25 mm */
.plabel{width:75mm;height:25mm;display:flex;align-items:center;gap:2.5mm;padding:0 2mm;background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;overflow:hidden;box-sizing:border-box}
.pqr{width:21mm;height:21mm;flex:none}.pqr svg{width:100%;height:100%;display:block}
.ptxt{min-width:0;flex:1;line-height:1.15}
.ptxt div{white-space:nowrap;overflow:hidden;text-overflow:clip}
.pk{font-weight:700;font-size:11pt}.p2{font-weight:700;font-size:9.5pt;margin-top:.6mm}.p3{font-size:7.5pt;margin-top:.4mm;min-height:1em}.pv{font-family:"Courier New",monospace;font-weight:700;font-size:7.5pt;margin-top:1.4mm}
.pvwrap .plabel{border:1px solid var(--line);margin-bottom:8px;max-width:100%}
#printarea{display:none}
.camwrap{position:relative;background:#000;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r)}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camframe{position:absolute;inset:18% 22%;border:3px solid var(--tred);border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
.maplink{display:inline-block;text-decoration:none;margin:2px 0 4px}
@media print{
  @page{size:75mm 25mm;margin:0}
  html,body{background:#fff!important;margin:0!important}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block!important}
  #printarea .plabel{page-break-after:always;break-after:page}
  #printarea .plabel:last-child{page-break-after:auto;break-after:auto}
}
</style>

function ago(ts){
  if(!ts) return "";
  const s = Math.round((now()-ts)/1000);
  if(s < 60) return "lige nu";
  const m = Math.round(s/60); if(m < 60) return m + " min. siden";
  const h = Math.round(m/60); if(h < 24) return h + " t. siden";
  const d = Math.round(h/24); if(d < 30) return d + (d===1?" dag":" dage") + " siden";
  return new Date(ts).toLocaleDateString("da-DK");
}

}

// ---------- VIN ----------
const WMI = {JTD:"Toyota",JTE:"Toyota",JTM:"Toyota",JTN:"Toyota",JTK:"Toyota",JTL:"Toyota",JTH:"Lexus",JTJ:"Lexus",SB1:"Toyota",VNK:"Toyota",NMT:"Toyota",TMB:"Skoda",WVW:"Volkswagen",WVG:"Volkswagen",WV1:"VW Erhverv",WV2:"VW Erhverv",WAU:"Audi",WUA:"Audi",VSS:"Cupra/Seat",WBA:"BMW",WBY:"BMW",WMW:"Mini",WDD:"Mercedes-Benz",W1K:"Mercedes-Benz",W1N:"Mercedes-Benz",WDC:"Mercedes-Benz",YV1:"Volvo",LYV:"Volvo",VF1:"Renault",UU1:"Dacia",VF3:"Peugeot",VR3:"Peugeot",VF7:"Citroën",VR7:"Citroën",ZFA:"Fiat",KMH:"Hyundai",TMA:"Hyundai",KNA:"Kia",U5Y:"Kia",KNE:"Kia",JMZ:"Mazda",JN1:"Nissan",SJN:"Nissan",WF0:"Ford",W0L:"Opel",W0V:"Opel",JMB:"Mitsubishi",JHM:"Honda",SHH:"Honda",XP7:"Tesla",LRW:"Tesla","5YJ":"Tesla",LSJ:"MG",TSM:"Suzuki",JSA:"Suzuki",SAL:"Land Rover",SAJ:"Jaguar",WP0:"Porsche",WP1:"Porsche",ZAR:"Alfa Romeo",VSK:"Nissan",LVS:"Ford",YS3:"Saab",WDB:"Mercedes-Benz",LPS:"Polestar",YSM:"Polestar",LBV:"BMW"};
function makeFromVin(vin){ return WMI[vin.slice(0,3)] || (vin.startsWith("JT") ? "Toyota" : ""); }
const VIN_RE = /[A-HJ-NPR-Z0-9]{17}/;
function normVin(s){
  let v = String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(v.length===18 && v[0]==="I") v = v.slice(1); // US-style "I"-prefix i Code 39
  return v;
}
function findVin(text){
  const t = String(text||"").toUpperCase();
  const clean = normVin(t);
  if(clean.length===17 && VIN_RE.test(clean)) return clean;
  const m = t.replace(/[^A-Z0-9]/g," ").split(/\s+/).map(normVin).find(x=>x.length===17 && VIN_RE.test(x));
  if(m) return m;
  const m2 = t.replace(/[^A-Z0-9]/g,"").match(VIN_RE);
  return m2 ? m2[0] : null;
}
// QR-format fra egne etiketter: FB:B:<id>  eller  FB:N1:<id>
function parseCode(text){
  const t = String(text||"").trim();
  if(/^https?:\/\//i.test(t)){ try{ const u=new URL(t); const b=u.searchParams.get("b"); if(b) return {id:b.toUpperCase(), target:u.searchParams.get("n")?"n"+u.searchParams.get("n"):"bil", raw:t}; }catch(e){} }
  const m = t.match(/^FB:(B|N\d):([A-Za-z0-9._~:@+-]+)$/i);
  if(m) return {id:m[2].toUpperCase(), target: m[1].toUpperCase()==="B" ? "bil" : "n"+m[1].slice(1), raw:t};
  const vin = findVin(t);
  if(vin) return {id:vin, target:"bil", raw:t};
  return null;
}

// ---------- server ----------
async function api(action, payload){
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)) throw {error:"OPSAETNING", besked:"API_URL er ikke sat i index.html – se opsætningsguiden."};
  let r;
  try{
    const resp = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action, token:S.token, payload:payload||{}})});
    r = await resp.json();
  }catch(e){ throw {error:"NET", besked:"Ingen forbindelse til serveren. Prøv igen."}; }
  if(r && r.error){ if(r.error==="AUTH" && action!=="login") logout(true); throw r; }
  return r;
}
function applyData(d){

// ---------- login / logud ----------
// Login gemmes på telefonen, så et scan via kameraet (ny fane) ikke kræver nyt login – men udløber efter inaktivitet
function sess(v){
  try{
    if(v===undefined){ const t=localStorage.getItem("fb_token"), a=+localStorage.getItem("fb_active")||0; return t && now()-a < AUTO_LOGUD_MIN*60000 ? t : null; }
    if(v===null){ localStorage.removeItem("fb_token"); localStorage.removeItem("fb_active"); }
    else { localStorage.setItem("fb_token", v); localStorage.setItem("fb_active", String(now())); }
  }catch(e){ return null; }
}
let idleT=null, lastStamp=0;
function bumpIdle(){
  if(!S.token) return;
  if(now()-lastStamp>15000){ lastStamp=now(); try{ localStorage.setItem("fb_active", String(now())); }catch(e){} }
  clearTimeout(idleT);
  idleT = setTimeout(()=>{ logout(false); toast("Du er logget ud pga. inaktivitet"); }, AUTO_LOGUD_MIN*60000);
}
["click","keydown","touchstart","scroll"].forEach(ev=>document.addEventListener(ev, bumpIdle, {passive:true}));
async function logout(expired){
  const t = S.token;
  S.token=null; S.me=null; S.loaded=false; S.vehicles=new Map(); sess(null);
  clearInterval(pollT); clearTimeout(idleT); closeSheet();
  if(t && !expired) fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"logout",token:t})}).catch(()=>{});
  if(expired) toast("Log ind igen");
  showLogin();
}

function vlabel(v){ return [v.maerke, v.model].filter(Boolean).join(" ") || "Ukendt bil"; }
function keysOf(v){ const k = v.noegler || {}; return Object.keys(k).filter(n=>k[n] && typeof k[n]==="object").sort().map(n => ({n, ...k[n]})); }
function keyName(v, n, form){

  if(cnt===1) return form==="label" ? "NØGLER" : "Nøgler";
  const nm = n==="1" ? "daglig" : n==="2" ? "reserve" : "";

  return "Nøgle "+n+(nm?" ("+nm+")":"");
}
function allKeysSel(v){ const o={}; (keysOf(v).length?keysOf(v).map(k=>k.n):["1"]).forEach(n=>o[n]=true); return o; }
function isKeyLoc(id){ const l=S.locations.find(x=>x.id===id); return l && l.type==="noegle"; }
function keyAwayFromCar(v){
  return keysOf(v).some(k => k.lokation && v.lokation && v.lokation!=="_ude" && k.lokation !== v.lokation && !SPECIAL[k.lokation] && !isKeyLoc(k.lokation) && S.locations.some(l=>l.id===k.lokation));
}
function sortLocs(arr){ return arr.slice().sort((a,b)=>a.navn.localeCompare(b.navn,"da")); }
function carLocs(){ return sortLocs(S.locations.filter(l=>l.type!=="noegle")); }
function keyLocs(){ return sortLocs(S.locations.filter(l=>l.type!=="bil")); }

// ---------- GPS ----------
const GPS = {pos:null, err:null, busy:false, watch:null};
const RADIUS_STD = 75; // m – skal matche RADIUS_STD i Code.gs
function hasPos(l){ return !!l && l.lat!=null && l.lng!=null && l.lat!=="" && l.lng!==""; }
function distM(a,b,c,d){ const r=Math.PI/180, x=Math.sin((c-a)*r/2), y=Math.sin((d-b)*r/2); return 2*6371000*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y)); }
function locDist(l,pos){ return hasPos(l)&&pos ? distM(+l.lat,+l.lng,pos.lat,pos.lng) : null; }
function hasPoly(l){ return !!l && Array.isArray(l.omraade) && l.omraade.length>=3; }
function hasArea(l){ return hasPoly(l) || hasPos(l); }
// Hjørner [[lat,lng],...] → flade meter-koordinater omkring (lat0,lng0)
function proj(poly,lat0,lng0){ const k=Math.PI/180*6371000, c=Math.cos(lat0*Math.PI/180); return poly.map(h=>[(h[1]-lng0)*k*c,(h[0]-lat0)*k]); }
function polyArea(pts){ let a=0; for(let i=0,j=pts.length-1;i<pts.length;j=i++) a+=(pts[j][0]+pts[i][0])*(pts[j][1]-pts[i][1]); return Math.abs(a/2); }
// Hvor langt (m) pos ligger UDEN FOR polygonen (0 = indenfor)
function polyOutside(poly,pos){
  const q=proj(poly,pos.lat,pos.lng); let inside=false, min=Infinity;
  for(let i=0,j=q.length-1;i<q.length;j=i++){
    const a=q[i], b=q[j];
    if((a[1]>0)!==(b[1]>0) && 0 < (b[0]-a[0])*(0-a[1])/(b[1]-a[1])+a[0]) inside=!inside;
    const dx=b[0]-a[0], dy=b[1]-a[1], L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,-(a[0]*dx+a[1]*dy)/L)):0;
    min=Math.min(min, Math.hypot(a[0]+t*dx, a[1]+t*dy));
  }
  return inside ? 0 : min;
}
// Lokationens område i forhold til pos: ude = meter uden for (0 = indenfor), areal i m²
function zone(l,pos){
  if(!pos) return null;
  if(hasPoly(l)) return {ude:polyOutside(l.omraade,pos), areal:polyArea(proj(l.omraade,pos.lat,pos.lng))};
  if(hasPos(l)){ const r=+l.radius||RADIUS_STD; return {ude:Math.max(0,locDist(l,pos)-r), areal:Math.PI*r*r}; }
  return null;
}
// Bil-lokation for GPS-positionen: står man inde i flere områder, vinder det mindste (fx showroom inde i udearealet).
// Ellers den nærmeste, der kan nås inden for GPS-usikkerheden.
function gpsLoc(pos){
  if(!pos) return null; let inde=null, naer=null;
  carLocs().forEach(l=>{ const z=zone(l,pos); if(!z) return;
    if(z.ude===0){ if(!inde || z.areal<inde.areal) inde={l,...z}; }
    else if(z.ude-pos.acc<=0 && (!naer || z.ude<naer.ude)) naer={l,...z}; });
  return inde||naer;
}
function curPick(){ const st=S.moveState && S.moveState.target==="bil" ? S.moveState : S.createState; return st||null; }
function selectLoc(id){
  document.querySelectorAll("#locgrid .locbtn").forEach(b=>b.classList.toggle("on", b.dataset.loc===id));
  if(S.moveState && $("#savemove")){ S.moveState.loc=id; $("#savemove").disabled=false; }
  if(S.createState && $("#savecreate")){ S.createState.loc=id; $("#savecreate").disabled=false; }
}
function gpsHook(){
  if(S.locEdit && S.locEdit.want && GPS.pos){
    S.locEdit.pos=GPS.pos; const i=$("#locposinfo");
    if(i) i.textContent = `Ny position klar (±${GPS.pos.acc} m) – gemmes når du trykker Gem.`;
  }
  if(S.locEdit && S.locEdit.wantCorner && GPS.pos && !GPS.busy){
    S.locEdit.wantCorner=false; S.locEdit.poly.push([GPS.pos.lat, GPS.pos.lng]); S.locEdit.polyChanged=true; polyShow();
  }
  const st=curPick(); if(!st) return;
  const m=gpsLoc(GPS.pos);
  if(m && !st.manual && st.loc!==m.l.id){ selectLoc(m.l.id); st.auto=m.l.id; st.warnAck=false; }
  locCheck();
}
// Sammenlign valgt lokation med GPS og vis info/advarsel under lokationsknapperne
function locCheck(){
  const st=curPick(), el=$("#locwarn"); if(!st||!el) return;
  st.mismatch=false; let html="";
  const l = st.loc && !SPECIAL[st.loc] ? S.locations.find(x=>x.id===st.loc) : null;
  const z = l ? zone(l,GPS.pos) : null;
  if(z){
    if(z.ude-GPS.pos.acc > 0){
      st.mismatch=true; const m=gpsLoc(GPS.pos);
      html=`<div class="banner warn" style="margin:8px 0 0">GPS viser, at bilen står ca. ${fmtDist(z.ude)} uden for <b>${esc(l.navn)}</b>.${m?` Den passer med <b>${esc(m.l.navn)}</b>. <button class="btn small" data-act="useloc" data-id="${esc(m.l.id)}">Vælg ${esc(m.l.navn)}</button>`:" Tjek at du har valgt den rigtige lokation."}</div>`;
    } else if(st.auto===st.loc && !st.manual){
      html=`<div class="tiny mut" style="margin-top:6px">Valgt automatisk ud fra GPS (${z.ude===0?"inden for området":"ca. "+fmtDist(z.ude)+" fra kanten"}).</div>`;
    }
  } else if(GPS.pos && st.loc && !SPECIAL[st.loc] && l && !hasArea(l) && isAdmin()){
    html=`<div class="tiny mut" style="margin-top:6px">${esc(l.navn)} har intet GPS-område, så valget kan ikke tjekkes. Sæt den under Indstillinger → Lokationer.</div>`;
  }
  el.innerHTML=html;
  const b=$("#savemove")||$("#savecreate");
  if(b && !b.textContent.startsWith("Gemmer") && !b.textContent.startsWith("Opretter")) b.textContent = $("#savemove") ? (st.mismatch&&st.warnAck?"Gem alligevel":"Gem placering") : (st.mismatch&&st.warnAck?"Opret alligevel":"Opret bil");
}
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(1).replace(".",",")+" km" : Math.round(m)+" m"; }
function gpsStart(){
  GPS.pos=null; GPS.err=null;
  if(!("geolocation" in navigator)){ GPS.err="Telefonen understøtter ikke placering"; gpsShow(); return; }
  GPS.busy=true; gpsShow();
  gpsStop();
  GPS.watch = navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    if(!GPS.pos || c.accuracy < GPS.pos.acc) GPS.pos={lat:c.latitude, lng:c.longitude, acc:Math.round(c.accuracy)};
    GPS.busy = GPS.pos.acc > 15; gpsShow();
    if(!GPS.busy) gpsStop();
  }, e=>{ GPS.busy=false; GPS.err = e.code===1 ? "Placering er ikke tilladt – slå det til i browserens indstillinger" : "Kunne ikke finde placering"; gpsShow(); gpsStop(); },
  {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  setTimeout(()=>{ if(GPS.busy){ GPS.busy=false; gpsStop(); gpsShow(); } }, 25000);
}
function gpsStop(){ if(GPS.watch!==null){ navigator.geolocation.clearWatch(GPS.watch); GPS.watch=null; } }
function gpsShow(){
  const el=$("#gpsstat"); if(!el) return;
  if(GPS.pos) el.innerHTML = `<span class="pill ${GPS.pos.acc<=25?"ok":"warn"}">GPS ±${GPS.pos.acc} m</span> ${GPS.busy?'<span class="tiny mut">forbedrer…</span>':'<span class="tiny mut">gemmes sammen med placeringen</span>'}`;
  else if(GPS.err) el.innerHTML = `<span class="pill warn">Ingen GPS</span> <span class="tiny mut">${esc(GPS.err)}</span>`;
  else el.innerHTML = GPS.busy ? `<span class="pill grey">Henter GPS…</span>` : `<span class="pill warn">Ingen GPS fundet</span>`;
  gpsHook();
}
function mapLink(v, label){
  if(v.gpsLat===""||v.gpsLat==null||v.gpsLng===""||v.gpsLng==null) return "";
  return `<a class="btn small maplink" href="https://www.google.com/maps/dir/?api=1&destination=${v.gpsLat},${v.gpsLng}" target="_blank" rel="noopener">${label||"Find bilen på kort"}</a>`;
}

// ----- oversigt
function viewOverview(){
  const active = [...S.vehicles.values()].filter(v=>v.status!=="Udleveret");
  if(!S.locations.length) return `<div class="card stack"><h2>Velkommen</h2><p>${isAdmin()?"Start med at oprette jeres lokationer og medarbejdere under Indstillinger.":"Der er ikke oprettet lokationer endnu. Bed en administrator om at oprette dem."}</p>${isAdmin()?'<button class="btn pri" data-tab="indstillinger">Gå til indstillinger</button>':""}</div>`;
  const byLoc = {};
  active.forEach(v=>{ const k=v.lokation||""; (byLoc[k] ||= {c:0,k:0}).c++; keysOf(v).forEach(x=>{ const kk=x.lokation||""; (byLoc[kk] ||= {c:0,k:0}).k++; }); });
  const hos = active.reduce((n,v)=>n+keysOf(v).filter(k=>k.lokation==="_hos").length,0);
  const away = active.filter(keyAwayFromCar).length;
  const noKey = active.filter(v=>!keysOf(v).some(k=>k.lokation)).length;
  const stats = [
    {n:active.length, t:"Biler i alt", f:{}},
    {n:active.filter(v=>v.status==="Klar til salg").length, t:"Klar til salg", f:{status:"Klar til salg"}},
    {n:active.filter(v=>v.status==="Klargøring").length, t:"I klargøring", f:{status:"Klargøring"}},
    {n:active.filter(v=>v.lokation==="_ude").length, t:"Biler ude af huset", f:{special:"ude"}},
    {n:hos, t:"Nøgler hos medarbejdere", f:{special:"hos"}},
    {n:away, t:"Nøgle på anden lokation end bilen", f:{special:"away"}, warn:away>0},
    {n:noKey, t:"Bil uden registreret nøgle", f:{special:"nokey"}, warn:noKey>0}
  ];
  const mine = active.filter(v=>keysOf(v).some(k=>k.lokation==="_hos" && k.af===S.me.id));
  return `
  ${mine.length?`<div class="banner info"><b>Du har ${mine.length} nøgle${mine.length>1?"r":""} på dig:</b> ${mine.map(v=>`<a href="#" data-open="${esc(v.id)}">${esc(v.regnr||vlabel(v))}</a>`).join(", ")}</div>`:""}
  <div class="grid">${stats.map(s=>`<button class="stat" data-goto='${esc(JSON.stringify(s.f))}'><b style="${s.warn?"color:var(--warn)":""}">${s.n}</b><span class="mut">${s.t}</span></button>`).join("")}</div>
  <h3>Pr. lokation</h3>
  <div class="stack">${sortLocs(S.locations).map(l=>{ const b=byLoc[l.id]||{c:0,k:0}; return `
    <button class="veh" data-goto='${esc(JSON.stringify({lok:l.id}))}'>
      <div class="row"><span class="t grow">${esc(l.navn)}</span><span class="pill grey">${l.type==="bil"?"Biler":l.type==="noegle"?"Nøgler":"Biler + nøgler"}</span></div>
      <div class="row small mut" style="margin-top:4px"><span class="loc" style="margin:0">${ICON.car} ${b.c} biler</span><span class="loc" style="margin:0">${ICON.key} ${b.k} nøgler</span></div>
    </button>`; }).join("")}</div>`;
}

// ----- liste
function filtered(){
  const f=S.f, q=f.q.trim().toUpperCase().replace(/\s+/g,"");
  return [...S.vehicles.values()].filter(v=>{
    if(f.status==="aktive" && v.status==="Udleveret") return false;
    if(f.status && f.status!=="aktive" && f.status!=="alle" && v.status!==f.status) return false;
    if(f.kat && v.kategori!==f.kat) return false;
    if(f.lok && v.lokation!==f.lok && !keysOf(v).some(k=>k.lokation===f.lok)) return false;
    if(f.special==="ude" && v.lokation!=="_ude") return false;
    if(f.special==="hos" && !keysOf(v).some(k=>k.lokation==="_hos")) return false;
    if(f.special==="away" && !keyAwayFromCar(v)) return false;
    if(f.special==="nokey" && keysOf(v).some(k=>k.lokation)) return false;
    if(q){ const hay=[v.id,v.vin,v.regnr,v.maerke,v.model,v.farve,v.note,v.plads].join(" ").toUpperCase().replace(/\s+/g,""); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>(b.opdateret||0)-(a.opdateret||0));
}
function viewList(){
  const f=S.f;
  const sp = {ude:"Biler ude af huset",hos:"Nøgler hos medarbejdere",away:"Nøgle på anden lokation end bilen",nokey:"Uden registreret nøgle"};
  return `
  <div class="row" style="margin-bottom:10px">
    <input type="search" id="q" class="grow" placeholder="Søg stelnr., reg.nr., model…" value="${esc(f.q)}" autocomplete="off">
    <button class="btn pri" data-act="new">+ Ny</button>
  </div>
  ${f.special?`<div class="banner info row"><span class="grow">Filter: ${sp[f.special]}</span><button class="btn" data-act="clearspecial">Fjern</button></div>`:""}
  <div class="chips">${["aktive",...STATUS,"alle"].map(s=>`<button class="chip ${f.status===s?"on":""}" data-fstatus="${s}">${s==="aktive"?"Aktive":s==="alle"?"Alle":s}</button>`).join("")}</div>

// Tegn hjørnerne som en lille skitse, så man kan se om formen ser rigtig ud
function polyShow(){
  const el=$("#polyview"), le=S.locEdit; if(!el||!le) return;
  const P=le.poly;
  if(!P.length){ el.innerHTML='<div class="small mut">Ingen hjørner endnu.</div>'; return; }
  const q=proj(P,P[0][0],P[0][1]), xs=q.map(a=>a[0]), ys=q.map(a=>a[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const W=300, H=180, pad=18, sc=Math.min((W-2*pad)/Math.max(x1-x0,1),(H-2*pad)/Math.max(y1-y0,1));
  const pt=a=>[pad+(a[0]-x0)*sc+((W-2*pad)-(x1-x0)*sc)/2, H-pad-(a[1]-y0)*sc-((H-2*pad)-(y1-y0)*sc)/2];
  const sp=q.map(pt), path=sp.map(a=>a.map(n=>n.toFixed(1)).join(",")).join(" ");
  const shape = sp.length>=3 ? `<polygon points="${path}" fill="rgba(255,0,34,.12)" stroke="#FF0022" stroke-width="2"/>` : sp.length===2 ? `<polyline points="${path}" fill="none" stroke="#FF0022" stroke-width="2"/>` : "";
  const dots = sp.map((a,i)=>`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="9" fill="#282830"/><text x="${a[0].toFixed(1)}" y="${(a[1]+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#fff">${i+1}</text>`).join("");
  const info = P.length>=3 ? `${P.length} hjørner · ca. ${Math.round(polyArea(q)).toLocaleString("da-DK")} m²${le.polyChanged?" · gemmes når du trykker Gem":""}` : `${P.length} hjørne${P.length>1?"r":""} – mindst 3 skal til`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;background:var(--bg2,#f2f2f2);display:block">${shape}${dots}</svg><div class="tiny mut" style="margin-top:4px">${info} · nord er op</div>`;
}

// ---------- scanning ----------
let zxReader=null, ZX=null, zxHints;
async function getBitmapCanvas(file, maxSide, rotate){
  let src;
  try{ src = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ src = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const w0=src.width, h0=src.height, sc=Math.min(1, maxSide/Math.max(w0,h0)), w=Math.round(w0*sc), h=Math.round(h0*sc);
  const c=document.createElement("canvas"); if(rotate){ c.width=h; c.height=w; } else { c.width=w; c.height=h; }
  const ctx=c.getContext("2d",{willReadFrequently:true});
  if(rotate){ ctx.translate(h,0); ctx.rotate(Math.PI/2); }
  ctx.drawImage(src,0,0,w,h);
  return {c, ctx, src};
}
function zxDecode(ctx, x, y, w, h){
  const d = ctx.getImageData(x,y,w,h).data, lum = new Uint8ClampedArray(w*h);
  for(let i=0,j=0;i<lum.length;i++,j+=4) lum[i] = (d[j]*306 + d[j+1]*601 + d[j+2]*117) >> 10;
  const out=[];
  for(const Bin of [ZX.HybridBinarizer, ZX.GlobalHistogramBinarizer]){
    try{ const r = zxReader.decode(new ZX.BinaryBitmap(new Bin(new ZX.RGBLuminanceSource(lum,w,h))), zxHints); if(r) out.push(r.getText()); }catch(e){}
    zxReader.reset(); if(out.length) break;
  }
  return out;
}
async function decodeImage(file){
  const found = new Set(); const good = () => [...found].some(t=>parseCode(t));
  if("BarcodeDetector" in window){
    try{ const det = new window.BarcodeDetector({formats:["qr_code","code_128","code_39","data_matrix"]}); const {src}=await getBitmapCanvas(file,2400,false);
      (await det.detect(src)).forEach(r=>found.add(r.rawValue)); if(good()) return [...found]; }catch(e){}
  }
  await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
  ZX = window.ZXing;
  if(!zxReader){
    zxReader = new ZX.MultiFormatReader(); zxHints = new Map();
    zxHints.set(ZX.DecodeHintType.TRY_HARDER, true);
    zxHints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [ZX.BarcodeFormat.QR_CODE, ZX.BarcodeFormat.CODE_39, ZX.BarcodeFormat.CODE_128, ZX.BarcodeFormat.DATA_MATRIX]);
    zxReader.setHints(zxHints);
  }
  for(const rotate of [false,true]) for(const max of [1400, 2200, 900]){
    const {c, ctx} = await getBitmapCanvas(file, max, rotate);
    zxDecode(ctx,0,0,c.width,c.height).forEach(t=>found.add(t)); if(good()) return [...found];
    for(const n of [3,5]){ const bh=Math.round(c.height/n*1.8), step=Math.round(c.height/n);
      for(let y=0;y<c.height;y+=step){ const hh=Math.min(bh,c.height-y); if(hh<40) break; zxDecode(ctx,0,y,c.width,hh).forEach(t=>found.add(t)); if(good()) return [...found]; } }
    await new Promise(r=>setTimeout(r,0));
  }
  return [...found];
}
async function handleScanFile(file){
  if(!file) return;
  openSheet(`<div class="hd"><h2>Læser QR-kode…</h2><button class="x" data-close>×</button></div><div class="spin"></div>`);
  let texts=[]; try{ texts = await decodeImage(file); }catch(e){}
  const parsed = texts.map(parseCode).filter(Boolean);
  if(!parsed.length){
    openSheet(`<div class="hd"><h2>Ingen QR-kode fundet</h2><button class="x" data-close>×</button></div>
      <p class="small">Prøv igen tættere på QR-koden og uden genskin.</p>
      <button class="btn pri block" data-act="cam">Prøv igen</button>

      <div class="row"><input type="text" id="manual" class="grow vin" placeholder="Stelnr., sidste cifre eller reg.nr." autocapitalize="characters"><button class="btn" data-act="manual">Find</button></div>`);
    return;
  }
  goToCode(parsed[0]);
}
function goToCode(p){
  if(S.vehicles.has(p.id)){ openMove(p.id, p.target); return; }
  if(/^[A-HJ-NPR-Z0-9]{17}$/.test(p.id)) { openCreate({vin:p.id, note:"Stelnummeret er ikke registreret endnu – opret bilen."}); return; }
  closeSheet(); toast("Ukendt etiket – bilen er måske slettet");
}
function manualLookup(q){
  q = q.trim().toUpperCase().replace(/\s+/g,""); if(!q) return;
  const vin = findVin(q); if(vin){ goToCode({id:vin,target:"bil"}); return; }
  const hits=[...S.vehicles.values()].filter(v=>(v.id+" "+(v.regnr||"")).toUpperCase().replace(/\s+/g,"").includes(q));
  if(hits.length===1){ openMove(hits[0].id,"bil"); return; }
  closeSheet(); S.tab="biler"; S.f={...S.f,q,special:"",lok:"",status:"alle"}; render();
}

// Live-scanning med kameraet (kræver https – virker på GitHub Pages)
const CAM = {stream:null, timer:null, det:null};
async function startCam(){
  const st=$("#camstat"), vid=$("#video");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ if(st) st.textContent="Kameraet kan ikke åbnes her – tag et billede i stedet."; $("#camwrap")?.classList.add("hidden"); return; }
  try{ CAM.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment", width:{ideal:1280}}, audio:false}); }
  catch(e){ if(st) st.textContent="Ingen adgang til kameraet – tag et billede i stedet."; $("#camwrap")?.classList.add("hidden"); return; }
  if(!$("#video")){ stopCam(); return; }
  vid.srcObject = CAM.stream; await vid.play().catch(()=>{});
  if(st) st.textContent="Hold QR-koden inden for rammen";
  if("BarcodeDetector" in window){ try{ CAM.det = new window.BarcodeDetector({formats:["qr_code"]}); }catch(e){ CAM.det=null; } }
  if(!CAM.det){ try{ await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"); }catch(e){} }
  const c=document.createElement("canvas"), ctx=c.getContext("2d",{willReadFrequently:true});
  const tick = async ()=>{
    if(!CAM.stream || !$("#video")) return;
    if(vid.videoWidth){
      let texts=[];
      try{
        if(CAM.det) texts=(await CAM.det.detect(vid)).map(r=>r.rawValue);
        else if(window.ZXing){
          const w=Math.min(800,vid.videoWidth), h=Math.round(vid.videoHeight*w/vid.videoWidth); c.width=w; c.height=h; ctx.drawImage(vid,0,0,w,h);
          if(!zxReader){ ZX=window.ZXing; zxReader=new ZX.MultiFormatReader(); zxHints=new Map(); zxHints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.QR_CODE]); zxHints.set(ZX.DecodeHintType.TRY_HARDER,true); zxReader.setHints(zxHints); }
          ZX=window.ZXing; texts=zxDecode(ctx,0,0,w,h);
        }
      }catch(e){}
      const p = texts.map(parseCode).find(Boolean);
      if(p){ if(navigator.vibrate) navigator.vibrate(60); stopCam(); goToCode(p); return; }
    }
    CAM.timer=setTimeout(tick, 250);
  };
  tick();
}
function stopCam(){ clearTimeout(CAM.timer); if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; } }

    if(await write("gemLokation",p,"Lokation gemt")) closeSheet(); else t.disabled=false;
  }
  else if(a==="polyadd"){ if(S.locEdit.wantCorner) return; S.locEdit.want=false; S.locEdit.wantCorner=true; gpsStart(); }
  else if(a==="polyundo"){ S.locEdit.poly.pop(); S.locEdit.polyChanged=true; polyShow(); }
  else if(a==="polyclr"){ gpsStop(); S.locEdit.wantCorner=false; S.locEdit.poly=[]; S.locEdit.polyChanged=true; $("#gpsstat").innerHTML=""; polyShow(); }
  else if(a==="locpos"){ S.locEdit.wantCorner=false;  S.locEdit.clear=false; S.locEdit.want=true; gpsStart(); }
  else if(a==="locposclr"){ gpsStop(); Object.assign(S.locEdit,{pos:null, clear:true, want:false}); $("#gpsstat").innerHTML=""; $("#locposinfo").textContent="Positionen fjernes, når du trykker Gem."; }
  else if(a==="delloc"){ $("#delwrap").innerHTML = `<div class="row"><span class="small grow">Slet lokationen?</span><button class="btn" data-close>Nej</button><button class="btn dan" data-act="delloc2" data-id="${esc(d.id)}">Ja, slet</button></div>`; }
  else if(a==="delloc2"){ if(await write("sletLokation",{id:d.id},"Lokation slettet")) closeSheet(); }
  else if(a==="saveemp"){
    const rolle=($("#er .on")||{dataset:{}}).dataset.er||"bruger"; t.disabled=true;
    if(await write("gemMedarbejder",{id:d.id||"", navn:$("#en").value, pin:$("#ep").value.trim(), rolle, aktiv:$("#ea").checked},"Medarbejder gemt")) closeSheet(); else t.disabled=false;
  }
  else if(a==="pinchange"){ openPinChange(); }
  else if(a==="savepin"){
    if($("#p1").value!==$("#p2").value){ toast("De to nye PIN-koder er ikke ens"); return; }
    t.disabled=true; if(await write("skiftPin",{gammel:$("#p0").value, ny:$("#p1").value},"PIN-kode skiftet")) closeSheet(); else t.disabled=false;
  }
  else if(a==="savedetail"){
    t.disabled=true;
    const felter={regnr:$("#dreg").value, status:$("#dst").value, maerke:$("#dmk").value, model:$("#dmd").value, farve:$("#dfa").value, kategori:$("#dkat").value, note:$("#dno").value};
    if(await write("retBil",{id:d.id, felter},"Gemt")) closeSheet(); else t.disabled=false;
  }
  else if(a==="addkey"){ t.disabled=true; if(await write("tilfoejNoegle",{id:d.id})){ const v=S.vehicles.get(d.id); const ns=keysOf(v).map(k=>k.n); openMove(d.id,"n"+ns[ns.length-1]); } }
  else if(a==="rmkey"){ t.disabled=true; if(await write("fjernNoegle",{id:d.id},"Reservenøgle fjernet")) openDetail(d.id); }
  else if(a==="delveh"){ $("#delwrap").innerHTML = `<button class="btn" data-open="${esc(d.id)}">Fortryd</button> <button class="btn dan" data-act="delveh2" data-id="${esc(d.id)}">Slet helt</button>`; }
  else if(a==="delveh2"){ if(await write("sletBil",{id:d.id},"Bil slettet")) closeSheet(); }
  else if(a==="lbladd"){ S.lbl.sel[d.id]={b:true,k:allKeysSel(S.vehicles.get(d.id))}; closeSheet(); S.tab="etiketter"; render(); toast("Tilføjet til etiketter"); }
  else if(a==="lblnew"){ const day=new Date(); day.setHours(0,0,0,0); S.vehicles.forEach(v=>{ if((v.oprettet||0)>=day.getTime()) S.lbl.sel[v.id]={b:true,k:allKeysSel(v)}; }); fillLabels(); }
  else if(a==="lblclear"){ S.lbl.sel={}; fillLabels(); }
  else if(a==="preview"){ openPreview(); }
  else if(a==="print"){ window.print(); }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.id==="q"){ S.f.q=t.value; fillList(); }
  else if(t.id==="lq"){ S.lbl.q=t.value; fillLabels(); }
  else if(t.id==="cvin"){ const v=normVin(t.value), mk=$("#cmk"); if(v.length===17 && mk && !mk.value) mk.value=makeFromVin(v); }
});
document.addEventListener("change", ev=>{
  const t=ev.target;
  if(t.id==="flok"){ S.f.lok=t.value; fillList(); }
  else if(t.id==="fkat"){ S.f.kat=t.value; fillList(); }
  else if(t.id==="cam" || t.id==="pick"){ const f=t.files && t.files[0]; t.value=""; handleScanFile(f); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Enter" && ev.target.id==="manual") manualLookup(ev.target.value);
  if(ev.key==="Enter" && ev.target.id==="pin") doLogin();
  if(ev.key==="Escape" && S.sheetOpen) closeSheet();
});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && S.token) reload(); });

// ---------- start ----------
(async function start(){
  const q = new URLSearchParams(location.search);
  if(q.get("b")){ S.pending = {id:q.get("b").toUpperCase(), target: q.get("n") ? "n"+q.get("n") : "bil"}; history.replaceState(null,"",location.pathname); }
  const t = sess();
  if(t){ S.token=t; await afterLogin(); return; }
  showLogin();
})();

})();
</script>
</body>
</html>
